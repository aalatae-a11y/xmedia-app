
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة إدارة الأرشيف - Xmedia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-blue-800 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fas fa-folder-open"></i> منظومة إدارة الأرشيف والبيانات
            </h1>
            <span class="bg-blue-900 text-xs px-3 py-1 rounded-full text-blue-200">Xmedia App</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-4 md:p-6">
        
        <!-- Form Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700 flex items-center gap-2">
                <i class="fas fa-plus-circle text-blue-600"></i> إضافة سجل جديد
            </h2>
            <form id="archiveForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">اسم الملف / السجل</label>
                    <input type="text" id="title" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="أدخل العنوان...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">التصنيف</label>
                    <input type="text" id="category" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="مثال: وثائق، تقارير...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">الملاحظات</label>
                    <input type="text" id="notes" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="ملاحظات إضافية...">
                </div>
                <div class="md:col-span-3 flex justify-end">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition font-medium flex items-center gap-2">
                        <i class="fas fa-save"></i> حفظ البيانات
                    </button>
                </div>
            </form>
        </div>

        <!-- Table Section -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-700 flex items-center gap-2">
                <i class="fas fa-list text-blue-600"></i> السجلات المحفوظة
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b text-gray-600 text-sm">
                            <th class="p-3">العنوان</th>
                            <th class="p-3">التصنيف</th>
                            <th class="p-3">الملاحظات</th>
                            <th class="p-3">التاريخ</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable" class="divide-y text-gray-700 text-sm">
                        <tr>
                            <td colspan="4" class="text-center p-4 text-gray-400">جاري تحميل البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Firebase Integration Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, orderBy } 
            from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بـ xmedia-db
        const firebaseConfig = {
            apiKey: "AIzaSyCeRCQr0KSM9uUVVxa-DJbAc4epzRjCNDM",
            authDomain: "xmedia-db.firebaseapp.com",
            projectId: "xmedia-db",
            storageBucket: "xmedia-db.firebasestorage.app",
            messagingSenderId: "76794291171",
            appId: "1:76794291171:web:47cdfab692b937c6e176d6"
        };

        // تهيئة التطبيق والقاعدة
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const archivesRef = collection(db, "archives");

        // إضافة سجل جديد
        const form = document.getElementById("archiveForm");
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("title").value;
            const category = document.getElementById("category").value;
            const notes = document.getElementById("notes").value;

            try {
                await addDoc(archivesRef, {
                    title,
                    category,
                    notes,
                    createdAt: serverTimestamp()
                });
                form.reset();
            } catch (err) {
                console.error("خطأ أثناء الحفظ:", err);
                alert("حدث خطأ أثناء حفظ البيانات!");
            }
        });

        // قراءة البيانات لحظياً (Real-time)
        const q = query(archivesRef, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const tableBody = document.getElementById("dataTable");
            if (snapshot.empty) {
                tableBody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-400">لا توجد سجلات حالياً.</td></tr>`;
                return;
            }

            tableBody.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const date = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleDateString("ar-LY") : "الآن";
                
                const tr = document.createElement("tr");
                tr.className = "hover:bg-gray-50";
                tr.innerHTML = `
                    <td class="p-3 font-medium">${data.title || '-'}</td>
                    <td class="p-3"><span class="bg-gray-100 text-gray-700 px-2 py-1 rounded text-xs">${data.category || '-'}</span></td>
                    <td class="p-3">${data.notes || '-'}</td>
                    <td class="p-3 text-gray-400 text-xs">${date}</td>
                `;
                tableBody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
