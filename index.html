<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Media | المنظومة الشاملة</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f1f5f9; color: #334155; padding-bottom: 40px; }
        .navbar { background-color: #0f172a; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: bold; color: #d97706; }
        .nav-btn { background: #1e293b; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .nav-btn.active { background: #d97706; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .admin-container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .card-header { background: #0f172a; color: white; padding: 15px; text-align: center; border-radius: 8px 8px 0 0; margin: -20px -20px 20px -20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center; text-decoration: none; display: inline-block; }
        .btn-green { background: #16a34a; color: white; }
        .btn-dark { background: #334155; color: white; }
        .btn-blue { background: #2563eb; color: white; }
        .btn-copy { background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .result-box { background: #f8fafc; border: 2px solid #fde68a; border-radius: 8px; padding: 15px; text-align: center; margin: 15px 0; }
        .result-price { font-size: 28px; font-weight: bold; color: #0f172a; margin: 5px 0; }
        .access-box { background: #eff6ff; border: 1px dashed #3b82f6; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .copy-input-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">X-MEDIA</div>
        <div>
            <button class="nav-btn active" id="btn-tab-pub" onclick="showTab('pub')">الحاسبة</button>
            <button class="nav-btn" id="btn-tab-adm" onclick="showTab('adm')">المنظومة</button>
        </div>
    </div>

    <!-- حاسبة الزبون -->
    <div id="section-public" class="container">
        <div class="card">
            <div class="card-header"><h2>حاسبة X-Media</h2></div>

            <!-- الحقول الأساسية -->
            <div class="form-group"><label>قيمة الإعلان ($)</label><input type="number" id="pub-usd" value="1" min="1" class="form-control" oninput="calc()"></div>
            <div class="form-group"><label>المدة (أيام)</label><input type="number" id="pub-days" value="1" min="1" class="form-control" oninput="calc()"></div>
            
            <!-- ملاحظات المدام -->
            <div class="form-group"><label>الهدف من الإعلان</label>
                <select id="pub-obj" class="form-control">
                    <option>زيادة رسائل</option><option>تفاعل ومشاركات</option><option>زيادة متابعين</option>
                </select>
            </div>
            <div class="form-group"><label>المدن المستهدفة</label><input type="text" id="pub-loc" placeholder="طرابلس، بنغازي..." class="form-control"></div>
            <div class="form-group"><label>الجنس</label>
                <select id="pub-gender" class="form-control"><option>الكل</option><option>رجال</option><option>نساء</option></select>
            </div>
            <div class="form-group"><label>طريقة الدفع</label>
                <select id="pub-payment" class="form-control">
                    <option>تسليم للمندوب (كاش)</option><option>خصم من رصيدي</option><option>تحويل بنكي/سداد</option><option>دفع آجل</option>
                </select>
            </div>
            <div class="form-group"><label>رابط المنشور</label><input type="url" id="pub-link" placeholder="https://..." class="form-control"></div>

            <div class="result-box">
                <span style="font-size: 12px; font-weight: bold;">المبلغ المطلوب</span>
                <div class="result-price" id="res-total">0 د.ل</div>
            </div>

            <!-- قسم إضافة المدير (التصميم الأنيق) -->
            <div class="access-box">
                <p style="font-size: 11px; color: #475569; margin-bottom: 8px;">1. انسخ اسم حسابنا:</p>
                <div class="copy-input-group">
                    <input type="text" id="acc-name" value="Rudy Alqalaly" readonly class="form-control" style="font-weight: bold;">
                    <button class="btn-copy" onclick="copyAccName()">نسخ</button>
                </div>
                <p style="font-size: 11px; color: #475569; margin-bottom: 8px;">2. انتقل للإعدادات، ابحث عن (الوصول للصفحة) وأضف الاسم:</p>
                <a href="https://www.facebook.com/settings?tab=profile_access" target="_blank" class="btn btn-blue" style="padding: 8px; font-size: 12px;">الذهاب لإعدادات الفيسبوك ↗</a>
            </div>

            <button class="btn btn-green" id="btn-submit" style="margin-top: 15px;">تأكيد الطلب وإرسال عبر الواتساب</button>
        </div>
    </div>

    <!-- المنظومة الداخلية (مختصرة) -->
    <div id="section-admin" class="admin-container hidden">
        <div id="pin-box" class="card" style="text-align: center;">
            <h3>المنظومة الداخلية</h3>
            <input type="password" id="pin-input" class="form-control" style="text-align: center; margin: 10px 0;">
            <button class="btn btn-navy" onclick="login()">دخول</button>
        </div>
        <div id="admin-main" class="hidden">
             <div class="card"><h3>مرحباً بك يا رودي</h3><p>المنظومة الداخلية مفعلة وجاهزة للعمل.</p></div>
        </div>
    </div>

    <script>
        window.EX_RATE = 7.45;
        function showTab(t) {
            document.getElementById('section-public').classList.toggle('hidden', t !== 'pub');
            document.getElementById('section-admin').classList.toggle('hidden', t !== 'adm');
        }
        function login() { if(document.getElementById('pin-input').value === "5412") { document.getElementById('pin-box').classList.add('hidden'); document.getElementById('admin-main').classList.remove('hidden'); } else { alert("رمز خاطئ!"); } }
        function calc() {
            var usd = parseFloat(document.getElementById('pub-usd').value) || 0;
            var total = usd * (window.EX_RATE * 1.20);
            document.getElementById('res-total').innerText = Math.round(total / 5) * 5 + " د.ل";
        }
        function copyAccName() { navigator.clipboard.writeText("Rudy Alqalaly"); alert("تم نسخ الاسم!"); }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCeRCQr0KSM9uUVVxa-DJbAc4epzRjCNDM", authDomain: "xmedia-db.firebaseapp.com", projectId: "xmedia-db", storageBucket: "xmedia-db.firebasestorage.app", messagingSenderId: "76794291171", appId: "1:76794291171:web:47cdfab692b937c6e176d6" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('btn-submit').onclick = async () => {
            const data = {
                usd: document.getElementById('pub-usd').value,
                days: document.getElementById('pub-days').value,
                obj: document.getElementById('pub-obj').value,
                loc: document.getElementById('pub-loc').value,
                gender: document.getElementById('pub-gender').value,
                pay: document.getElementById('pub-payment').value,
                link: document.getElementById('pub-link').value,
                createdAt: serverTimestamp()
            };
            await addDoc(collection(db, "orders"), data);
            const msg = `طلب إعلان جديد:\nالميزانية: $${data.usd}\nالمدة: ${data.days} أيام\nالهدف: ${data.obj}\nالمنطقة: ${data.loc}\nالجنس: ${data.gender}\nطريقة الدفع: ${data.pay}\nالرابط: ${data.link}`;
            window.open("https://wa.me/218910756281?text=" + encodeURIComponent(msg), '_blank');
        };
    </script>
</body>
</html>
