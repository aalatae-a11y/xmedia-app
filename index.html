<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>X-Media | المنظومة المالية المتكاملة</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background-color: #f1f5f9; padding: 10px; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-control { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: right; }
        .flex { display: flex; gap: 10px; }
    </style>
</head>
<body>

<!-- التبويبات -->
<div style="text-align: center; margin-bottom: 20px;">
    <button class="btn" onclick="show('pub')">حاسبة الزبون</button>
    <button class="btn" onclick="show('adm')">المنظومة المالية</button>
</div>

<!-- 1. الحاسبة -->
<div id="section-pub">
    <div class="card">
        <h3>طلب إعلان جديد</h3>
        <input type="number" id="c-usd" class="form-control" placeholder="قيمة الإعلان ($)">
        <input type="text" id="c-obj" class="form-control" placeholder="الهدف (رسائل/تفاعل)">
        <select id="c-pay" class="form-control"><option>كاش</option><option>آجل</option><option>رصيد مسبق</option></select>
        <button class="btn" style="background:#16a34a; color:white; width:100%" onclick="submitOrder()">إرسال الطلب</button>
    </div>
</div>

<!-- 2. المنظومة المالية -->
<div id="section-adm" class="hidden">
    <div class="card">
        <h3>تسجيل حركة مالية</h3>
        <select id="fin-type" class="form-control">
            <option value="expense">مصروف (أكل، إنترنت، شخصي)</option>
            <option value="dollar">شراء دولار</option>
            <option value="other_income">دخل آخر</option>
        </select>
        <input type="number" id="fin-amt" class="form-control" placeholder="المبلغ (د.ل)">
        <input type="text" id="fin-desc" class="form-control" placeholder="ملاحظات (مثلاً: شريت دولار بسعر 7.5)">
        <button class="btn" style="background:#2563eb; color:white;" onclick="addFinance()">حفظ الحركة</button>
    </div>

    <div class="card">
        <h3>كشف الطلبات (الإيرادات)</h3>
        <table>
            <thead><tr><th>الزبون/الهدف</th><th>القيمة</th><th>الطريقة</th></tr></thead>
            <tbody id="orders-list"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>سجل المصروفات والمشتريات</h3>
        <table>
            <thead><tr><th>النوع</th><th>المبلغ</th><th>التفاصيل</th></tr></thead>
            <tbody id="finance-list"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({ apiKey: "AIzaSyCeRCQr0KSM9uUVVxa-DJbAc4epzRjCNDM", authDomain: "xmedia-db.firebaseapp.com", projectId: "xmedia-db", storageBucket: "xmedia-db.firebasestorage.app", messagingSenderId: "76794291171", appId: "1:76794291171:web:47cdfab692b937c6e176d6" }));

    // عرض الأقسام
    window.show = (t) => {
        document.getElementById('section-pub').classList.toggle('hidden', t !== 'pub');
        document.getElementById('section-adm').classList.toggle('hidden', t !== 'adm');
    };

    // إضافة طلب (إيراد)
    window.submitOrder = async () => {
        const order = { usd: document.getElementById('c-usd').value, obj: document.getElementById('c-obj').value, pay: document.getElementById('c-pay').value };
        await addDoc(collection(db, "orders"), order);
        alert("تم تسجيل الطلب!");
    };

    // إضافة مصروف أو مشتريات (حركة مالية)
    window.addFinance = async () => {
        const fin = { type: document.getElementById('fin-type').value, amt: document.getElementById('fin-amt').value, desc: document.getElementById('fin-desc').value };
        await addDoc(collection(db, "finance"), fin);
        alert("تم تسجيل الحركة!");
    };

    // جلب البيانات
    onSnapshot(query(collection(db, "orders"), orderBy("usd", "desc")), (s) => {
        const l = document.getElementById('orders-list'); l.innerHTML = "";
        s.forEach(d => { const v = d.data(); l.innerHTML += `<tr><td>${v.obj}</td><td>${v.usd}$</td><td>${v.pay}</td></tr>`; });
    });

    onSnapshot(query(collection(db, "finance")), (s) => {
        const l = document.getElementById('finance-list'); l.innerHTML = "";
        s.forEach(d => { const v = d.data(); l.innerHTML += `<tr><td>${v.type}</td><td>${v.amt} د.ل</td><td>${v.desc}</td></tr>`; });
    });
</script>
</body>
</html>
