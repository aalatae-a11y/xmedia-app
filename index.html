<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>X-Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg">
        <h1 class="text-xl font-bold mb-4">إعدادات المنظومة</h1>
        <input type="number" id="rate-input" class="w-full border p-2 mb-2" placeholder="سعر الدولار">
        <button onclick="saveRate()" class="w-full bg-blue-600 text-white p-2 rounded">حفظ السعر</button>
        <div id="status" class="mt-4 text-sm font-bold"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCeRCQr0KSM9uUVVxa-DJbAc4epzRjCNDM",
            authDomain: "xmedia-db.firebaseapp.com",
            projectId: "xmedia-db",
            storageBucket: "xmedia-db.firebasestorage.app",
            messagingSenderId: "76794291171",
            appId: "1:76794291171:web:47cdfab692b937c6e176d6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveRate = async () => {
            const val = parseFloat(document.getElementById('rate-input').value);
            try {
                await setDoc(doc(db, "settings", "config"), { exchangeRate: val }, { merge: true });
                document.getElementById('status').innerText = "تم الحفظ بنجاح!";
                document.getElementById('status').className = "mt-4 text-green-600";
            } catch (e) {
                document.getElementById('status').innerText = "خطأ: " + e.message;
            }
        };
    </script>
</body>
</html>
